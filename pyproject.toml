[project]
name = "etfquant-desk"
version = "0.2.0"
description = "ETF专属量化分析桌面软件"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
alpha = [
    "torch>=2.0",
    "alphagen",
]
ml = [
    "xgboost==0.90",
    "scikit-learn>=1.3",
    "simtrademl",
]
backtest = [
    "simtradelab",
]
all = [
    "etfquant-desk[alpha,ml,backtest]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
etfquant-desk = "etfquant.ui.app:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
